name: mint-murmur
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  mint:
    runs-on: [self-hosted, probe]
    steps:
      - name: Mint murmur-webhook token
        shell: bash
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=murmur-webhook" | jq -r .value)
          echo "$token" > /home/dave/security-research/macroscope/data/oidc-probe/murmur-fresh-token.txt
          echo "stashed len=${#token}"