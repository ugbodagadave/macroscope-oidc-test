name: mint-port-fwd
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  mint:
    runs-on: [self-hosted, probe]
    steps:
      - name: Mint token aud=murmur-port-forward and stash
        shell: bash
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=murmur-port-forward" | jq -r .value)
          echo "$token" > /home/dave/security-research/macroscope/data/oidc-probe/portfwd-token.txt
          echo "stashed len=${#token}"