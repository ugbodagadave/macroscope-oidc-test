name: mint-port-fwd
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - name: Mint token aud=murmur-port-forward
        shell: bash
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=murmur-port-forward" | jq -r .value)
          echo "$token" > portfwd-token.txt
          echo "len=${#token}"
          echo "$token" | python3 -c "import sys,base64,json; h,p,s=sys.stdin.read().strip().split('.'); print(json.dumps(json.loads(base64.urlsafe_b64decode(p+'==')), indent=1))"
      - uses: actions/upload-artifact@v4
        with:
          name: portfwd-token
          path: portfwd-token.txt
          if-no-files-found: error